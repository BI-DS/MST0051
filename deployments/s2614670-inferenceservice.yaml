apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "vae-fraud-detector"
  # MUST match your student ID exactly. Replace student-id below.
  namespace: "s2614670"
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    maxReplicas: 1
    tolerations:
    - key: "reservedFor"
      operator: "Equal"
      value: "lab2pool"
      effect: "NoSchedule"
    nodeSelector:
      agentpool: "lab2pool"
    model:
      modelFormat:
        name: tensorflow
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      # Pattern: .../mlflow-artifacts/<experiment-id>/<run-id>/artifacts/model
      # Experiment 43, run f95d7fc9b70b43758ca22df3b878ed6e (your Lab 1 run).
      # Verify against the path shown in the MLflow UI before submitting.
      storageUri: "https://mlopsartifacts2026.blob.core.windows.net/mlflow-artifacts/43/f95d7fc9b70b43758ca22df3b878ed6e/artifacts/model"
