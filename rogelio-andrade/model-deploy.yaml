apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "vae-fraud-detector"
  # MUST match your student ID
  namespace: "rogelio-andrade" 
spec:
  predictor:
    canaryTrafficPercent: 20
    serviceAccountName: kserve-sa
    minReplicas: 1
    maxReplicas: 1
    tolerations:
    - key: "reservedFor"
      operator: "Equal"
      value: "lab2pool"
      effect: "NoSchedule"
    nodeSelector:
      agentpool: "lab2pool"
    model:
      modelFormat:
        name: tensorflow
      # You MUST specify resource limits, otherwise your deployment will be rejected by the namespace quota
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      # IMPORTANT: Copy the "Full Path" from the MLflow UI Artifacts section.
      # Example format: mlflow-artifacts:/0/f7ad2a8acf204a66a0ba9aec7fcf9afa/artifacts/model
      storageUri: "https://mlopsartifacts2026.blob.core.windows.net/mlflow-artifacts/1/a723b101d7d04defa36e24ec16775422/artifacts/model" 
