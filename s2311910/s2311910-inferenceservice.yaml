
apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"

metadata:
  name: "vae-fraud-detector"
  namespace: "s2311910"

spec:
  predictor:
    serviceAccountName: kserve-sa

    minReplicas: 1
    maxReplicas: 1

    tolerations:
      - key: "reservedFor"
        operator: "Equal"
        value: "lab2pool"
        effect: "NoSchedule"

    nodeSelector:
      agentpool: "lab2pool"

    model:
      modelFormat:
        name: tensorflow

      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"

      storageUri: "https://mlopsartifacts2026.blob.core.windows.net/mlflow-artifacts/44/1fb92dfb09f94a8e9ab2df8d3663d2ff/artifacts/model"
