apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "vae-fraud-detector"
  namespace: "s2613146" 
spec:
  predictor:
    canaryTrafficPercent: 20    # NEW : Route 20% traffic to Canary
    serviceAccountName: kserve-sa
    minReplicas: 1
    maxReplicas: 1
    tolerations:
    - key: "reservedFor"
      operator: "Equal"
      value: "lab2pool"
      effect: "NoSchedule"
    nodeSelector:
      agentpool: "lab2pool"
    model:
      modelFormat:
        name: tensorflow
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      serviceAccountName: kserve-sa

      # UPDATED : Point to NEW MLFlow ID ,     and remember to REMOVE ":"
      storageUri: "https://mlopsartifacts2026.blob.core.windows.net/mlflow-artifacts/45/730eac6e22a641d8b4d16dce9eef700a/artifacts/model"
                                                                                     